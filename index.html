<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CORE-CRUSH</title>
  </head>
  <body>
    <div id="overlay">
      <h1>CORE-CRUSH</h1>
      <p>ローカル試遊：WASD 移動 / マウス 視点 / 左クリック 投げる／跳ね返し（A・D・S で球種） / 右クリック キャッチ / Q 対象切替（黄枠：ロック、輪：飛行対象） / F フリ / 左Shift ステップ / C 球召喚 / Esc マウス解放</p>
      <fieldset id="match-mode">
        <legend>人数（開始後は固定・変更は再読み込み）</legend>
        <label><input type="radio" name="mode" value="1v1" checked /> 1v1</label>
        <label><input type="radio" name="mode" value="1v2" /> 1v2（自分1人対ボット2人）</label>
        <label><input type="radio" name="mode" value="2v2" /> 2v2（味方ボット1人）</label>
      </fieldset>
      <fieldset id="character">
        <legend>自分のキャラ（固有スキルは未実装・能力差だけ）</legend>
      </fieldset>
      <p id="roster-preview"></p>
      <fieldset id="effects">
        <legend>演出</legend>
        <label>効果音 <input id="effect-volume" type="range" min="0" max="100" value="100" /></label>
        <label><input id="effect-mute" type="checkbox" /> ミュート</label>
        <label><input id="effect-shake" type="checkbox" checked /> 画面の揺れ</label>
        <label><input id="effect-flash" type="checkbox" checked /> 閃光</label>
      </fieldset>
      <button id="start" disabled>読み込み中…</button>
      <p id="audio-status" role="status"></p>
      <section id="online">
        <h2>オンライン対戦</h2>
        <p id="online-status" role="status">読み込み中…</p>
        <div id="online-entry" hidden>
          <label>対戦形式 <select id="online-mode"><option>1v1</option><option>1v2</option><option>2v2</option></select></label>
          <button id="room-create">部屋を作る</button>
          <form id="room-join"><label>招待コード <input id="invite-code" autocomplete="off" spellcheck="false" maxlength="32" pattern="[a-fA-F0-9]{32}" required /></label><button>参加</button></form>
        </div>
        <div id="online-lobby" hidden>
          <label>招待コード（身内だけに共有） <input id="room-code" readonly aria-label="共有する招待コード" /></label>
          <p id="room-roster"></p>
          <p id="room-progress" role="status"></p>
          <button id="room-begin" hidden>全員で開始</button>
          <button id="room-confirm" hidden>結果を確認して部屋へ戻る</button>
          <button id="room-leave">部屋を退出</button>
        </div>
      </section>
    </div>
    <div id="reticle"></div>
    <p id="judgement" aria-live="polite"></p>
    <div id="hit-edge"></div>
    <p id="network-status" role="status" hidden></p>
    <pre id="hud"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
